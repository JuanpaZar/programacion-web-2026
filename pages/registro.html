<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | NODO</title>
</head>

<body>
  <header>
    <h1>Crear cuenta</h1>
    <p>Registrate</p>
  </header>

  <main>
    <form action="" method="GET">

      <fieldset>
        <legend>Datos de registro</legend>
        <div>
          <label for="inp-nombre">Nombre:</label>
          <input
            type="text"
            id="inp-nombre"
            name="nombre"
            placeholder="Escribe tu nombre"
            required
            minlength="2"
            maxlength="40">
        </div>
        <br>

        <div>
          <label for="inp-correo">Correo electronico:</label>
          <input
            type="email"
            id="inp-correo"
            name="correo"
            placeholder="ejemplo@correo.com"
            required>
        </div>
        <br>

    <div>
          <label for="inp-contrasena">Contraseña:</label>
          <input
            type="password"
            id="inp-contrasena"
            name="contrasena"
            placeholder="Crea una contraseña"
            required
            minlength="6">
        </div>
        <br>

        <div>
          <label for="sel-tema">Tema que mas te interesa:</label>
          <select id="sel-tema" name="tema">
            <option value="sociedad">Sociedad contemporanea</option>
            <option value="tecnologia">El impacto de la Tecnologia y redes sociales</option>
            <option value="cultura">Algoritmos</option>
            <option value="condiciones-materiales">Condiciones materiales</option>
          </select>
        </div>
        <br>
        <div>
          <p>Que tipo de contenido prefieres?</p>

          <input
            type="radio"
            id="rad-corto"
            name="tipo_contenido"
            value="corto"
            checked>
          <label for="rad-corto">Lecturas cortas</label>
           <input
            type="radio"
            id="rad-largo"
            name="tipo_contenido"
            value="largo">
          <label for="rad-largo">Articulos largos</label>
        </div>
        <br>

         <div>
          <label for="txt-temas">De cual tema te interesaria saber mas?</label>
          <textarea
            id="txt-temas"
            name="temas"
            placeholder="Escribe aqui algun tema que te interese"></textarea>
        </div>
    <br>

        <div>
          <input
            type="checkbox"
            id="chk-notificaciones"
            name="notificaciones"
            value="aceptado">

           <label for="chk-notificaciones">
            Quiero recibir nuevos articulos por correo
          </label>
        </div>
      </fieldset>
      <br>

    <div>
         <button type="submit">Crear cuenta</button>
      </div>

    </form>

  </main>

  <footer>
    <p><strong>NODO 1</strong></p>
    <small>© Derechos reservados.</small>
  </footer>

</body>

</html>
